name: Test Automation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUN_LIVE_TESTS: ${{ vars.RUN_LIVE_TESTS || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Playwright tests
        if: ${{ env.RUN_LIVE_TESTS == 'true' }}
        run: npx playwright test --project=chromium

      - name: Prepare Allure config
        if: always()
        run: |
          mkdir -p allure-results
          cp allure-config/environment.properties allure-results/ 2>/dev/null || true
          cp allure-config/categories.json allure-results/ 2>/dev/null || true

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            playwright-report/
            allure-report/
            reports/
